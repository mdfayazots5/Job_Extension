<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Jobs</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { box-sizing: border-box; margin: 0; width: 220px; padding: 10px; }
      .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      button { display: inline-flex; min-width: 0; min-height: 34px; align-items: center; justify-content: center; border: 0; border-radius: 6px; cursor: pointer; font: 600 12px system-ui, sans-serif; padding: 6px 8px; }
      button:focus-visible, a:focus-visible { outline: 3px solid #4387ff; outline-offset: 2px; }
      #start { background: #0a66c2; color: #fff; }
      #stop { background: #b73a4b; color: #fff; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      #view-results { background: #edf3fa; color: #174f86; }
      @media (prefers-color-scheme: dark) {
        #view-results { background: #283746; color: #a9d2ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="controls" aria-label="Collector controls">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button">Stop</button>
        <button id="view-results" type="button">View</button>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="src/core/storage.js"></script>
    <script src="src/sites/linkedin/selectors.js"></script>
    <script src="src/sites/linkedin/metadata.js"></script>
    <script src="src/sites/linkedin/adapter.js"></script>
    <script src="src/sites/naukri/config.js"></script>
    <script src="src/sites/naukri/selectors.js"></script>
    <script src="src/sites/naukri/adapter.js"></script>
    <script src="src/sites/indeed/config.js"></script>
    <script src="src/sites/indeed/selectors.js"></script>
    <script src="src/sites/indeed/parse.js"></script>
    <script src="src/sites/indeed/adapter.js"></script>
    <script src="src/sites/registry.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
